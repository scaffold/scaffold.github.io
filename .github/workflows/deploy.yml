name: Deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs — we want
# production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # react-router build prerenders every static route into build/client/
        # and, with ssr:false, removes the server build afterwards.
        run: npm run build

      - name: Add SPA fallback for Pages
        # Pages serves 404.html for any path with no matching file. Routes that
        # aren't prerendered — the /docs redirect and client-side 404s — need to
        # boot React Router's SPA shell, so point 404.html at it.
        #
        # Note that Pages serves this with an HTTP 404 status, which is correct
        # for real 404s; /docs resolves its redirect client-side from that page.
        run: cp build/client/__spa-fallback.html build/client/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # build/client is the deployable output — build/ itself is one level up.
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
